
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Student Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Student Management</div>
        <div class="nav-links">
            <a href="/records" id="nav-records">Records</a>
            {% if session.get('role') == 'admin' %}
                <a href="/admin" id="nav-admin">Admin Panel</a>
            {% endif %}
            <span id="welcome">Welcome, {{ session.get('username', 'User') }}</span>
            <a href="/logout" id="logout">Logout</a>
        </div>
    </nav>

    <main class="page-container">
        <header class="page-header">
            <div>
                <h1>{{ title }}</h1>
                <p>Enter the student's information below.</p>
            </div>
        </header>

        <section class="form-card">
            {% if error %}
                <p class="error-message" id="error-msg">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{{ request.path }}" id="student-form">
                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter student name"
                        value="{{ student.get('name', '') }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input
                        type="text"
                        id="course"
                        name="course"
                        placeholder="Enter course"
                        value="{{ student.get('course', '') }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter student email"
                        value="{{ student.get('email', '') }}"
                        required
                    >
                </div>

                <div class="form-actions">
                    <a href="/records" id="cancel-btn" class="secondary-btn">
                        Cancel
                    </a>
                    <button type="submit" id="save-btn">
                        Save Student
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
